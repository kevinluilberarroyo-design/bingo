<!DOCTYPE html>
<html>
<head>
<title>Login Bingo</title>

<style>
body{
background:#111;
color:white;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.box{
background:#222;
padding:30px;
border-radius:15px;
width:320px;
text-align:center;
box-shadow:0 0 20px rgba(0,0,0,.5);
}

input{
width:100%;
padding:10px;
margin:8px 0;
box-sizing:border-box;
font-size:16px;
}

button{
padding:10px;
width:100%;
background:gold;
border:none;
font-size:18px;
cursor:pointer;
font-weight:bold;
}

#msg{
margin-top:10px;
color:red;
min-height:20px;
}
</style>

</head>

<body>

<div class="box">

<h2>🎯 LOGIN BINGO</h2>

<input id="user" placeholder="Usuario">
<input id="pass" type="password" placeholder="Clave">

<button id="btnLogin" type="button">Entrar</button>

<div id="msg"></div>

</div>

<script>

// 🔥 SERVER
const API = window.location.origin;

// 🔐 LOGIN
document.getElementById("btnLogin").onclick = async function () {

  const usuario = document.getElementById("user").value.trim();
  const clave = document.getElementById("pass").value.trim();
  const msg = document.getElementById("msg");

  msg.innerText = "";

  if (!usuario || !clave) {
    msg.innerText = "Ingrese usuario y clave";
    return;
  }

  try {

    const res = await fetch(API + "/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ usuario, clave })
    });

    const data = await res.json(); // 🔥 SIN inventos

    console.log("RESPUESTA:", data);

    if (data.ok) {

      // 🔥 GUARDADO CORRECTO
      localStorage.setItem("logueado", "true");
      localStorage.setItem("usuario", usuario);
      localStorage.setItem("rol", (data.rol || "").toLowerCase().trim());

      console.log("GUARDADO:", localStorage.getItem("usuario"), localStorage.getItem("rol"));

      msg.innerText = "LOGIN OK";

      setTimeout(() => {
        window.location.href = "./admin.html";
      }, 300);

    } else {
      msg.innerText = "Usuario o clave incorrecta";
    }

  } catch (e) {
    console.error(e);
    msg.innerText = "Error conexión con servidor";
  }
};

</script>

</body>
</html>
